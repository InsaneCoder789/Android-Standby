plugins { id 'com.android.application' }

android {
    namespace 'com.rohan.standby'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rohan.standby'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No release keystore ships with the project: use keystore.properties when present, otherwise sign with the debug key so the build installs for testing.
            def props = rootProject.file('keystore.properties')
            if (props.exists()) {
                def k = new Properties(); props.withInputStream { k.load(it) }
                signingConfig signingConfigs.create('release') { storeFile file(k['storeFile']); storePassword k['storePassword']; keyAlias k['keyAlias']; keyPassword k['keyPassword'] }
            } else { signingConfig signingConfigs.debug }
        }
    }

    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
